ogle.com/maps?q=44.395722,-103.745491"}, {"n": "North Pole Rd, NFSR 287", "la": "43.75103", "lo": "-103.73341", "onx": "https://webmap.onxmaps.com/offroad/map/query/43.75103,-103.73341,13/overview", "g": "https://www.google.com/maps?q=43.75103,-103.73341"}, {"n": "Taylor Ranch Rd meadow", "la": "44.002914", "lo": "-103.454769", "onx": "https://webmap.onxmaps.com/offroad/map/query/44.002914,-103.454769,13/overview", "g": "https://www.google.com/maps?q=44.002914,-103.454769"}, {"n": "Top of Mountain / Mt Roosevelt Rd", "la": "44.388218", "lo": "-103.759036", "onx": "https://webmap.onxmaps.com/offroad/map/query/44.388218,-103.759036,13/overview", "g": "https://www.google.com/maps?q=44.388218,-103.759036"}]}, {"name": "Devils Tower", "start": "2026-10-17", "end": "2026-10-17", "approx": false, "note": "Sat Oct 17, ~130 mi / ~2.5 h from the Hills. The Tower campground closes Oct 15, so options are the reservoir or Warren Peak in Wyoming.", "spots": [{"n": "Belle Fourche Reservoir / Susie Peak", "la": "44.7307", "lo": "-103.7292", "onx": "https://webmap.onxmaps.com/offroad/map/query/44.7307,-103.7292,13/overview", "g": "https://www.google.com/maps?q=44.7307,-103.7292"}, {"n": "Devils Tower NM", "la": "44.5906", "lo": "-104.6982", "onx": "https://webmap.onxmaps.com/offroad/map/query/44.5906,-104.6982,13/overview", "g": "https://www.google.com/maps?q=44.5906,-104.6982"}, {"n": "Warren Peak Rd FR 838, Sundance", "la": "44.451206", "lo": "-104.432024", "onx": "https://webmap.onxmaps.com/offroad/map/query/44.451206,-104.432024,13/overview", "g": "https://www.google.com/maps?q=44.451206,-104.432024"}]}, {"name": "Casper, WY area", "start": "2026-10-18", "end": "2026-10-18", "approx": true, "note": "BLM dispersed: Willow Creek, Pathfinder, or Bolton Creek. Also: Muddy Mountain CG ($7, half with Senior Pass). Exact pin TBD.", "spots": [{"n": "Casper area (general)", "la": "42.867", "lo": "-106.313", "onx": "https://webmap.onxmaps.com/offroad/map/query/42.867,-106.313,13/overview", "g": "https://www.google.com/maps?q=42.867,-106.313"}]}, {"name": "Rock Springs, WY / I-80", "start": "2026-10-19", "end": "2026-10-19", "approx": true, "note": "BLM dispersed. Firehole Canyon CG is closed; skip it.", "spots": [{"n": "Middle Baxter Rd BLM", "la": "41.540071", "lo": "-109.107774", "onx": "https://webmap.onxmaps.com/offroad/map/query/41.540071,-109.107774,13/overview", "g": "https://www.google.com/maps?q=41.540071,-109.107774"}, {"n": "Wild Horse Facility pullout", "la": "41.630", "lo": "-109.220", "onx": "https://webmap.onxmaps.com/offroad/map/query/41.630,-109.220,13/overview", "g": "https://www.google.com/maps?q=41.630,-109.220"}]}, {"name": "Lava Hot Springs, ID", "start": "2026-10-20", "end": "2026-10-20", "approx": true, "note": "Lower Portneuf IDFG: 8 free sites. Portneuf Bend: private, open year-round, has water.", "spots": [{"n": "Lower Portneuf (IDFG)", "la": "42.642188", "lo": "-112.004568", "onx": "https://webmap.onxmaps.com/offroad/map/query/42.642188,-112.004568,13/overview", "g": "https://www.google.com/maps?q=42.642188,-112.004568"}, {"n": "Portneuf Bend CG", "la": "42.619", "lo": "-112.012", "onx": "https://webmap.onxmaps.com/offroad/map/query/42.619,-112.012,13/overview", "g": "https://www.google.com/maps?q=42.619,-112.012"}]}, {"name": "Home: Boise / Meridian", "start": "2026-10-21", "end": "2026-10-21", "approx": true, "note": "Home.", "spots": []}];
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Denver',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function fmt(s){return new Date(s+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
function todayIdx(){var t=today();for(var i=0;i<SITS.length;i++){if(t<=SITS[i].end)return i;}return SITS.length-1;}
function render(){
 var ti=todayIdx();var h=location.hash.match(/n=(\d+)/);var i=h?Math.min(+h[1],SITS.length-1):ti;
 var s=SITS[i],t=today(),isNow=(t>=s.start&&t<=s.end);
 var when=fmt(s.start)+(s.end!==s.start?' – '+fmt(s.end):'')+(s.approx?' (approx.)':'');
 var o='<div class="when">'+when+(isNow?' <span class="badge">TONIGHT</span>':'')+'</div><h1>'+s.name+'</h1><div class="note">'+s.note+'</div>';
 s.spots.forEach(function(p){o+='<div class="spot"><strong>'+p.n+'</strong><br><span class="coords">'+p.la+', '+p.lo+'</span><br><a class="btn onx" href="'+p.onx+'" target="_blank" rel="noopener">onX Offroad</a><a class="btn g" href="'+p.g+'" target="_blank" rel="noopener">Google Maps</a></div>';});
 o+='<div class="nav">'+(i>0?'<a href="#n='+(i-1)+'">&larr; Previous</a>':'<span></span>')+(i!==ti?'<a href="#">Tonight</a>':'')+(i<SITS.length-1?'<a href="#n='+(i+1)+'">Next &rarr;</a>':'<span></span>')+'</div>';
 o+='<div class="foot"><a href="locations.html">Full locations page</a> &middot; <a href="./">Trip map</a></div>';
 document.getElementById('app').innerHTML=o;window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);render();
</script></body></html>
