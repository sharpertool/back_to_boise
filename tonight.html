<script>
var SITS=[{"name": "Badlands: Cedar Pass Campground", "start": "2026-10-10", "end": "2026-10-10", "approx": false, "note": "Developed NPS campground: water, flush toilets, $1 dump. Moving to the Black Hills Sun Oct 11.", "spots": [{"n": "Cedar Pass Campground", "la": "43.746409", "lo": "-101.946614", "onx": "https://webmap.onxmaps.com/offroad/map/query/43.746409,-101.946614,13/overview", "g": "https://www.google.com/maps?q=43.746409,-101.946614"}, {"n": "Conata Basin dispersed", "la": "43.782492", "lo": "-102.240161", "onx": "https://webmap.onxmaps.com/offroad/map/query/43.782492,-102.240161,13/overview", "g": "https://www.google.com/maps?q=43.782492,-102.240161"}, {"n": "Nomad View dispersed", "la": "43.893099", "lo": "-102.238540", "onx": "https://webmap.onxmaps.com/offroad/map/query/43.893099,-102.238540,13/overview", "g": "https://www.google.com/maps?q=43.893099,-102.238540"}], "pois": {"title": "Points of interest: Corn Palace to Cedar Pass", "summary": "Corn Palace to Cedar Pass: ~210 mi, ~3 h 15 min driving at 65 mph (~222 mi / ~3 h 50 min touching every stop, plus visit time). Badlands is on Mountain time, 1 h behind: clocks go back west of Murdo. Leaving 4:40 PM CT puts you at Cedar Pass ~6:55 PM MT; sunset there ~6:15 PM MT. Listed in driving order, not ranked.", "items": [{"n": "Corn Palace, Mitchell", "la": "43.714706", "lo": "-98.025077", "note": "Crop-art murals redone every year; free admission and parking (no overnights).", "leg": "Start: Mitchell (I-90 exit 332)", "visit": "20\u201330 min", "hours": "Daily 8 AM\u20135 PM CT, open year-round (cornpalace.com). Closes 5 PM CT today.", "status": "", "onx": "https://webmap.onxmaps.com/offroad/map/query/43.714706,-98.025077,14/overview", "g": "https://www.google.com/maps?q=43.714706,-98.025077"}, {"n": "Dignity: of Earth and Sky (Chamberlain rest area)", "la": "43.786875", "lo": "-99.338286", "note": "50-ft steel statue with a star quilt above the Missouri River; rest area at I-90 MM 264, both directions. red lot)", "la": "43.761903", "lo": "-101.927224", "note": "Door: ~1 mi RT (boardwalk start). Window: short boardwalk. Notch: ladder route.", "leg": "~2 mi / ~5 min from Big Badlands Overlook", "visit": "Door + Window 30\u201345 min", "hours": "Open 24 h. Notch Trail CLOSED for ladder repairs (NPS alert, Oct 2026).", "status": "Sun AM loop", "onx": "https://webmap.onxmaps.com/offroad/map/query/43.761903,-101.927224,14/overview", "g": "https://www.google.com/maps?q=43.761903,-101.927224"}, {"n": "Ben Reifel Visitor Center", "la": "43.749350", "lo": "-101.941970", "note": "Park film, exhibits, rangers, passport stamp; next to Cedar Pass Lodge and the campground.", "leg": "~2 mi / ~6 min from Door/Window/Notch", "visit": "30\u201345 min", "hours": "9 AM\u20134 PM MT daily (winter hours, NPS). Closed by arrival tonight; open Sun.", "status": "", "onx": "https://webmap.onxmaps.com/offroad/map/query/43.749350,-101.941970,14/overview", "g": "https://www.google.com/maps?q=43.749350,-101.941970"}, {"n": "Fossil Exhibit Trail", "la": "43.77225", "lo": "-102.00322", "note": "\u00bc-mi accessible boardwalk with touchable fossil replicas; restrooms, bus/RV parking (NPS).", "leg": "~5 mi / ~12 min west of Ben Reifel (~5 mi past camp, on Loop Rd toward Wall)", "visit": "20\u201330 min", "hours": "Open 24 h.", "status": "Sun AM loop", "onx": "https://webmap.onxmaps.com/offroad/map/query/43.77225,-102.00322,14/overview", "g": "https://www.google.com/maps?q=43.77225,-102.00322"}, {"n": "Badlands Loop Road (SD-240), Sun AM", "la": "43.78", "lo": "-102.05", "note": "Drive SD-240 west from Cedar Pass to I-90 exit 110 at Wall, ~30 mi, ~1 h straight or 2\u20133 h with stops. With the trailer, use the big pull-outs. Notch Trail closed.", "leg": "Starts at Cedar Pass / Ben Reifel VC; ~30 mi to Wall (I-90 exit 110)", "visit": "~1 h straight, 2\u20133 h with stops", "hours": "Open 24 h (park road).", "status": "", "onx": "https://webmap.onxmaps.com/offroad/map/query/43.78,-102.05,14/overview", "g": "https://www.google.com/maps/dir/?api=1&origin=43.7493,-101.9419&destination=Wall,SD&waypoints=43.7860,-101.9016%7C43.7722,-102.0032&travelmode=driving", "nps": "https://www.nps.gov/thingstodo/badl-loop-road.htm"}]}}, {"name": "Black Hills (base Hill City / Custer)", "start": "2026-10-11", "end": "2026-10-16", "approx": false, "note": "Sun Oct 11 move from Cedar Pass (~2 h direct; see morning plan). Weekdays: Ed works until about 2 pm MT, so Vicki takes the truck. Needles Hwy and Iron Mountain Rd are truck only; skip Needles Eye tunnel. SD Black Hills NF: Stage 1, no open fires. Developed options: Custer SP Game Lodge and Blue Bell campgrounds (water and dump to about Nov 1).", "spots": [{"n": "Bear Mountain Lookout Rd, FDR 293", "la": "43.863490", "lo": "-103.760022", "onx": "https://webmap.onxmaps.com/offroad/map/query/43.863490,-103.760022,13/overview", "g": "https://www.google.com/maps?q=43.863490,-103.760022"}, {"n": "Blue Bell Campground (Custer SP), possible", "la": "43.716916", "lo": "-103.482236", "onx": "https://webmap.onxmaps.com/offroad/map/query/43.716916,-103.482236,13/overview", "g": "https://www.google.com/maps?q=43.716916,-103.482236", "note": "Custer SP on SD-87 south of US-16A, next to Blue Bell Lodge (avoid Needles Hwy north). Open to Nov 1: water, dump, showers; electric sites $34 (tent $16/$23), 31 sites. Needs $25 7-day Custer SP license per vehicle; Senior Pass NOT valid. Res 800-710-2267."}, {"n": "Calumet Rd / Cosmos", "la": "43.940199", "lo": "-103.452105", "onx": "https://webmap.onxmaps.com/offroad/map/query/43.940199,-103.452105,13/overview", "g": "https://www.google.com/maps?q=43.940199,-103.452105"}, {"n": "Deerfield Lake area: search area (scout in onX)", "la": "44.019", "lo": "-103.799", "onx": "https://webmap.onxmaps.com/offroad/map/query/44.019,-103.799,13/overview", "g": "https://www.google.com/maps?q=44.019,-103.799", "note": "SEARCH AREA, not a campsite (pin = lake centroid). BHNF: no dispersed camping around the reservoir except designated sites; elsewhere only on MVUM-dot roads, 1/2 mi from campgrounds/picnic areas, 100 ft from streams, 14 days in 28. Legal fallback: free off-season Custer Trail, Dutchman (top loop), Whitetail (lower loop), no water, 50 ft spurs."}, {"n": "Game Lodge Campground (Custer SP)", "la": "43.760650", "lo": "-103.371203", "onx": "https://webmap.onxmaps.com/offroad/map/query/43.760650,-103.371203,13/overview", "g": "https://www.google.com/maps?q=43.760650,-103.371203", "note": "Developed CG on US-16A, \u00bc mi east of the State Game Lodge. Electric sites $34 ($27 non-electric); water, dump and showers through about Nov 1. Needs the $25 7-day Custer SP entrance license per vehicle; Senior Pass NOT valid in Custer SP. Res 800-710-2267."}, {"n": "Mt Roosevelt corridor pullouts", "la": "44.395722", "lo": "-103.745491", "onx": "https://webmap.onxmaps.com/offroad/map/query/44.395722,-103.745491,13/overview", "g": "https://www.google.com/maps?q=44.395722,-103.745491"}, {"n": "North Pole Rd, NFSR 287", "la": "43.75103", "lo": "-103.73341", "onx": "https://webmap.onxmaps.com/offroad/map/query/43.75103,-103.73341,13/overview", "g": "https://www.google.com/maps?q=43.75103,-103.73341"}, {"n": "Pactola Reservoir area: search area (scout in onX)", "la": "44.075", "lo": "-103.507", "onx": "https://webmap.onxmaps.com/offroad/map/query/44.075,-103.507,13/overview", "g": "https://www.google.com/maps?q=44.075,-103.507", "note": "SEARCH AREA, not a campsite (pin = reservoir centroid). BHNF: no dispersed camping around the reservoir except designated sites; elsewhere only on MVUM-dot roads, 1/2 mi from developed sites, 100 ft from streams, 14 days in 28. Pactola CG closed Oct 1; Loop B/Osprey Trail area closed (BKF-195-2026)."}, {"n": "Rafter J Bar Ranch (private, Hill City)", "la": "43.891558", "lo": "-103.592484", "onx": "https://webmap.onxmaps.com/offroad/map/query/43.891558,-103.592484,13/overview", "g": "https://www.google.com/maps?q=43.891558,-103.592484", "note": "Full ail is closed for ladder repairs. Then Cedar Pass to Hill City ~110 mi / ~2 h towing via I-90 and Rapid City (Custer ~125 mi / ~2.5 h). Continuing west on Loop Rd to Wall: ~120 mi / ~2 h 45 min to Hill City."}, {"name": "Devils Tower", "start": "2026-10-17", "end": "2026-10-17", "approx": false, "note": "Sat Oct 17, ~130 mi / ~2.5 h from the Hills. The Tower campground closes Oct 15, so options are the reservoir or Warren Peak in Wyoming.", "spots": [{"n": "Belle Fourche Reservoir / Susie Peak", "la": "44.7307", "lo": "-103.7292", "onx": "https://webmap.onxmaps.com/offroad/map/query/44.7307,-103.7292,13/overview", "g": "https://www.google.com/maps?q=44.7307,-103.7292"}, {"n": "Devils Tower NM", "la": "44.5906", "lo": "-104.6982", "onx": "https://webmap.onxmaps.com/offroad/map/query/44.5906,-104.6982,13/overview", "g": "https://www.google.com/maps?q=44.5906,-104.6982"}, {"n": "Warren Peak Rd FR 838, Sundance", "la": "44.451206", "lo": "-104.432024", "onx": "https://webmap.onxmaps.com/offroad/map/query/44.451206,-104.432024,13/overview", "g": "https://www.google.com/maps?q=44.451206,-104.432024"}]}, {"name": "Casper, WY area", "start": "2026-10-18", "end": "2026-10-18", "approx": true, "note": "BLM dispersed: Willow Creek, Pathfinder, or Bolton Creek. Also: Muddy Mountain CG ($7, half with Senior Pass). Exact pin TBD.", "spots": [{"n": "Casper area (general)", "la": "42.867", "lo": "-106.313", "onx": "https://webmap.onxmaps.com/offroad/map/query/42.867,-106.313,13/overview", "g": "https://www.google.com/maps?q=42.867,-106.313"}]}, {"name": "Rock Springs, WY / I-80", "start": "2026-10-19", "end": "2026-10-19", "approx": true, "note": "BLM dispersed. Firehole Canyon CG is closed; skip it.", "spots": [{"n": "Middle Baxter Rd BLM", "la": "41.540071", "lo": "-109.107774", "onx": "https://webmap.onxmaps.com/offroad/map/query/41.540071,-109.107774,13/overview", "g": "https://www.google.com/maps?q=41.540071,-109.107774"}, {"n": "Wild Horse Facility pullout", "la": "41.630", "lo": "-109.220", "onx": "https://webmap.onxmaps.com/offroad/map/query/41.630,-109.220,13/overview", "g": "https://www.google.com/maps?q=41.630,-109.220"}]}, {"name": "Lava Hot Springs, ID", "start": "2026-10-20", "end": "2026-10-20", "approx": true, "note": "Lower Portneuf IDFG: 8 free sites. Portneuf Bend: private, open year-round, has water.", "spots": [{"n": "Lower Portneuf (IDFG)", "la": "42.642188", "lo": "-112.004568", "onx": "https://webmap.onxmaps.com/offroad/map/query/42.642188,-112.004568,13/overview", "g": "https://www.google.com/maps?q=42.642188,-112.004568"}, {"n": "Portneuf Bend CG", "la": "42.619", "lo": "-112.012", "onx": "https://webmap.onxmaps.com/offroad/map/query/42.619,-112.012,13/overview", "g": "https://www.google.com/maps?q=42.619,-112.012"}]}, {"name": "Home: Boise / Meridian", "start": "2026-10-21", "end": "2026-10-21", "approx": true, "note": "Home.", "spots": []}];
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Denver',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function fmt(s){return new Date(s+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
function todayIdx(){var t=today();for(var i=0;i<SITS.length;i++){if(t<=SITS[i].end)return i;}return SITS.length-1;}
function dateFor(off){var d=new Date();d.setUTCDate(d.getUTCDate()+off);return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Denver',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);}
function idxFor(t){for(var i=0;i<SITS.length;i++){if(t<=SITS[i].end)return i;}return SITS.length-1;}
function poiHtml(s,btnA,btnB,btnC){if(!s.pois)return '';var P=s.pois,h='<div class="pois"><h2>'+P.title+'</h2><div class="sum">'+P.summary+'</div>';
 P.items.forEach(function(p){var st=p.status==='Skipped (optional)'?'<span class="skip">'+p.status+'</span>':(p.status?'<span class="am">'+p.status+'</span>':'');
 h+='<div class="poi'+(p.status==='Skipped (optional)'?' skipped':'')+'"><span class="tag">POI</span><strong>'+p.n+'</strong>'+st+'<br><span class="coords onx-coords">'+p.la+', '+p.lo+'</span><div>'+p.note+'</div><div class="meta">&#128663; '+p.leg+' &middot; &#9201; Visit '+p.visit+'<br>&#128339; '+p.hours+'</div><a class="'+btnA+'" href="'+p.onx+'" target="_blank" rel="noopener">onX Offroad</a><a class="'+btnB+'" href="'+p.g+'" target="_blank" rel="noopener">Google Maps</a>'+(p.nps?'<a class="'+btnC+'" href="'+p.nps+'" target="_blank" rel="noopener">NPS page</a>':'')+'</div>';});
 return h+'</div>';}

 var OFF=0;var t=dateFor(OFF);var i=idxFor(t);var s=SITS[i];

 document.getElementById('app').innerHTML=o;
}
