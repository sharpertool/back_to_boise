function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Denver',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function fmt(s){return new Date(s+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
function todayIdx(){var t=today();for(var i=0;i<SITS.length;i++){if(t<=SITS[i].end)return i;}return SITS.length-1;}
function dateFor(off){var d=new Date();d.setUTCDate(d.getUTCDate()+off);return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Denver',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);}
function idxFor(t){for(var i=0;i<SITS.length;i++){if(t<=SITS[i].end)return i;}return SITS.length-1;}
function poiHtml(s,btnA,btnB,btnC){if(!s.pois)return '';var P=s.pois,h='<div class="pois"><h2>'+P.title+'</h2><div class="sum">'+P.summary+'</div>';

 return h+'</div>';}
