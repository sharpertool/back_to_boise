<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Phoenix 2026 — Boise scenic run</title>
  <style>
    :root {
      --panel: #ffffff;
      --text: #1a202c;
      --muted: #4a5568;
      --accent: #2b6cb0;
      --accent-dark: #2c5282;
      --border: #cbd5e0;
      --err-bg: #fff5f5;
      --err: #c53030;
      --tap: 44px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text); background: #e2e8f0; -webkit-text-size-adjust: 100%;
    }
    body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    header {
      flex: 0 0 auto; padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top));
      background: var(--panel); border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 3px rgba(0,0,0,.08); z-index: 10;
    }
    .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-width: 0; }
    header h1 { margin: 0; font-size: 1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .title-links { display: flex; gap: 10px; flex: 0 0 auto; align-items: baseline; }
    .title-row a { flex: 0 0 auto; font-size: 0.85rem; color: var(--accent); font-weight: 600; text-decoration: none; padding: 6px 0; }
    #controls { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 6px; }
    #origin-select, #search-fallback {
      width: 100%; min-height: var(--tap); padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 16px; background: #fff; color: var(--text);
    }
    #search-fallback { border-style: dashed; background: #f7fafc; color: var(--muted); }
    #search-wrap { width: 100%; min-width: 0; min-height: var(--tap); }
    #search-wrap gmp-place-autocomplete { width: 100%; min-height: var(--tap); font-size: 16px; color-scheme: light; }
    .btn-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    button.ctrl, a.ctrl {
      display: inline-flex; align-items: center; justify-content: center; min-height: var(--tap);
      padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: #edf2f7;
      color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none;
      touch-action: manipulation; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    button.ctrl:active, a.ctrl:active { filter: brightness(0.93); }
    button.ctrl.primary, a.ctrl.primary { background: var(--accent); border-color: var(--accent-dark); color: #fff; }
    #msg { margin-top: 6px; font-size: 13px; line-height: 1.35; color: var(--muted); overflow-wrap: anywhere; }
    #msg:empty { display: none; }
    #msg.error { color: var(--err); background: var(--err-bg); border: 1px solid #feb2b2; border-radius: 8px; padding: 8px 10px; font-weight: 600; }
    #map-wrap { position: relative; flex: 1 1 auto; min-height: 240px; overflow: hidden; }
    #map { position: absolute; inset: 0; }
    #legend {
      position: absolute; left: 8px; bottom: 22px; z-index: 5;
      max-width: min(340px, calc(100vw - 70px));
      background: rgba(255,255,255,0.96); border: 1px solid #ccc; border-radius: 8px;
      font-size: 12px; line-height: 1.45; box-shadow: 0 1px 4px rgba(0,0,0,.15);
    }
    #legend summary {
      cursor: pointer; padding: 10px 12px; font-weight: 700; font-size: 13px;
      min-height: var(--tap); display: flex; align-items: center; gap: 8px; list-style: none;
    }
    #legend summary::-webkit-details-marker { display: none; }
    #legend summary::before { content: "▸"; }
    #legend[open] summary::before { content: "▾"; }
    #legend .body { padding: 0 12px 10px; max-height: 48vh; overflow: auto; }
    #legend a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .layer-row, .route-row { display: flex; align-items: flex-start; gap: 6px; margin: 4px 0; }
    .layer-row input, .route-row input { width: 18px; height: 18px; margin-top: 2px; flex: 0 0 auto; }
    .swatch {
      display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 4px;
      vertical-align: -1px; border: 2px solid transparent; flex: 0 0 auto;
    }
    .swatch.stay { background: #dd6b20; }
    .swatch.paid { background: #7ec8ff; border-color: #1c5d99; }
    .swatch.dispersed { background: #2f855a; }
    .swatch.keystop { background: #7b3fa0; border-color: #4a235f; }
    .swatch.visit { background: #fff; border-color: #2c7a7b; transform: rotate(45deg); border-radius: 2px; width: 10px; height: 10px; }
    .swatch.twoday { background: #d69e2e; border-color: #975a16; border-radius: 2px; }
    .swatch.route { width: 18px; height: 4px; border-radius: 2px; border: 0; vertical-align: 3px; margin-top: 7px; }
    .route-copy { min-width: 0; }
    .route-copy b { display: block; }
    .fine { color: var(--muted); }
    #directions-panel {
      position: absolute; z-index: 6; left: 0; right: 0; bottom: 0; max-height: 55%; overflow: auto;
      background: rgba(255,255,255,0.98); border-top: 1px solid var(--border); border-radius: 14px 14px 0 0;
      box-shadow: 0 -2px 10px rgba(0,0,0,.15); padding: 10px 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom)); font-size: 14px; display: none;
    }
    #directions-panel.show { display: block; }
    #directions-panel .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    #directions-panel h2 { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
    #dir-close { flex: 0 0 auto; width: var(--tap); height: var(--tap); border: none; background: transparent; font-size: 22px; cursor: pointer; color: var(--muted); }
    #dir-route { color: var(--muted); margin: 4px 0 6px; overflow-wrap: anywhere; }
    #dir-summary { font-size: 20px; font-weight: 700; margin: 4px 0 8px; }
    #dir-summary:empty { display: none; }
    #dir-error { color: var(--err); background: var(--err-bg); border: 1px solid #feb2b2; border-radius: 8px; padding: 8px 10px; margin: 6px 0 8px; font-weight: 600; overflow-wrap: anywhere; }
    #dir-error:empty { display: none; }
    #dir-actions { display: grid; grid-template-columns: 1fr; gap: 6px; }
    #dir-note { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .iw { max-width: 280px; font-size: 14px; line-height: 1.4; }
    .iw b { display: block; margin-bottom: 2px; }
    .iw .sub { color: var(--muted); font-size: 12px; }
    .iw .note { font-size: 12px; margin-top: 4px; }
    .iw .iw-links { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
    .iw .iw-actions { display: grid; gap: 6px; margin-top: 8px; }
    .iw .iw-actions .ctrl { font-size: 14px; }
    .pin {
      display: flex; align-items: center; justify-content: center; border-radius: 50%;
      border: 3px solid; font-weight: 700; font-size: 12px; line-height: 1;
      box-shadow: 0 1px 3px rgba(0,0,0,.35); cursor: pointer;
    }
    @media (min-width: 760px) {
      header { padding: 10px 14px; }
      #controls { grid-template-columns: minmax(200px, 280px) minmax(220px, 1fr) auto; align-items: center; }
      .btn-row { grid-template-columns: repeat(3, auto); }
      #directions-panel {
        left: auto; top: 12px; right: 12px; bottom: auto; width: 360px; max-height: calc(100% - 24px);
        border: 1px solid var(--border); border-radius: 10px;
      }
      #legend { bottom: 28px; left: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title-row">
      <h1>Phoenix 2026 — scenic run</h1>
      <span class="title-links">
        <a href="locations.html">Locations →</a>
      </span>
    </div>
    <div id="controls">
      <select id="origin-select" aria-label="Directions origin">

    <div id="msg" role="status" aria-live="polite"></div>

        <h2 id="dir-title">Directions</h2>

      <div id="dir-summary"></div>
      <div id="dir-error"></div>
      <div id="dir-actions">
        <a id="dir-gmaps" class="ctrl primary" href="#" target="_blank" rel="noopener">Open in Google Maps</a>

      <div id="dir-note"></div>

  </div>

  <script id="trip-data" type="application/json">{"places": [{"name": "CURRENT: Boise / home", "lat": 43.612, "lng": -116.392, "layer": "current", "note": "Current sit. Map opens here. Same home pin as the other trip maps (Boise / Meridian). Nothing on this Phoenix run is reserved. Hitching and packing takes about 2–3 hours. Ed works remote weekdays 6 a.m.–3 p.m. Mountain time, so the long hops are weekend days.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/43.612,-116.392,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=43.612,-116.392"}, {"label": "Locations", "href": "locations.html"}]}, {"name": "Lamoille Canyon / Thomas Canyon (HTNF) search", "lat": 40.6472, "lng": -115.4068, "layer": "dispersed", "note": "Search area, not a reserved site. Pin is the Forest Service coordinate for Thomas Canyon Campground in Lamoille Canyon (7,200 ft), about 30 miles from Elko. Reservations are generally Memorial Day to Labor Day; drinking water is off in the fall first-come window. The canyon road is not plowed in winter. Nevada trail notes say passenger cars cannot use it once snow closes it. Do not plan a November night up this canyon.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/40.6472,-115.4068,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=40.6472,-115.4068"}, {"label": "Forest Service", "href": "https://www.fs.usda.gov/r04/humboldt-toiyabe/recreation/thomas-canyon-campground"}]}, {"name": "Ward Mountain (BLM north trailhead) search", "lat": 39.22259, "lng": -114.96999, "layer": "dispersed", "note": "Ely-area public-land search. Pin is the BLM north trailhead on US-6, about 6 miles southwest of Ely: free, restrooms, no potable water, trails. The Forest Service Ward Mountain Campground is across the highway (fee, no hookups, about 7,350 ft, 39.2092, -114.9712). Snow at the summit is likely in November. Nevada BLM dispersed stay is 14 days in any 28, then move at least 25 miles, unless a site posts something else.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/39.22259,-114.96999,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=39.22259,-114.96999"}, {"label": "BLM", "href": "https://www.blm.gov/visit/ward-mountain-recreation-area"}]}, {"name": "Sacramento Pass (BLM) search", "lat": 39.1215, "lng": -114.305, "layer": "dispersed", "note": "Free BLM camp area on US-50, about 40 miles east of Ely and about 20 miles from Great Basin National Park. Ten sites, first-come, 14-day limit, restrooms, no potable water. Lower than Wheeler Peak. A usable Great Basin-side search if the park campgrounds are closed or too short for the trailer.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/39.1215,-114.305,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=39.1215,-114.305"}, {"label": "BLM", "href": "https://www.blm.gov/visit/sacramento-pass-rec-area"}]}, {"name": "Patterson Pass (BLM) search", "lat": 37.97734, "lng": -114.53748, "layer": "dispersed", "note": "No-fee BLM site on the US-93 leg between Ely and Pioche. From Pioche, 47 miles north on US-93, then 1 mile west. Restrooms, tables, grills, fire pits, shade. No drinking water is listed. Ely District, 775-726-8100. Nevada 14-day / 28-day dispersed rule unless posted otherwise.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/37.97734,-114.53748,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=37.97734,-114.53748"}, {"label": "BLM", "href": "https://www.blm.gov/visit/patterson-pass"}]}, {"name": "Curlew Campground (Curlew National Grassland)", "lat": 42.0705556, "lng": -112.6913889, "layer": "dispersed", "note": "Named grassland campground about 7 miles north of Snowville, on the I-84 east side used by Routes A, B, and D (not the Jackpot turn). Recreation.gov: open year-round, no electric, water, or sewer hookups. Stone Reservoir is closed to boats. A concessionaire manages it; confirm any fee at 208-757-3999. Pin is the campground, not a dispersed dot.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/42.0705556,-112.6913889,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=42.0705556,-112.6913889"}, {"label": "Recreation.gov", "href": "https://www.recreation.gov/camping/campgrounds/233970"}]}, {"name": "White House / Paria (Grand Staircase) search", "lat": 37.07993889, "lng": -111.8902833, "layer": "dispersed", "note": "Named BLM campground on the Paria, the Kanab-side Grand Staircase search. Recreation.gov: open year-round, first-come, vault toilets, seven car sites and walk-in tent sites. Confirm the posted fee at the information board. This is not a hookup park. US-89 can be snowy between Kanab and Page. Do not assume a long dirt road is trailer-ready until you scout it in the truck.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/37.07993889,-111.8902833,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=37.07993889,-111.8902833"}, {"label": "Recreation.gov", "href": "https://www.recreation.gov/camping/campgrounds/256924"}]}, {"name": "Bulldog Canyon (Tonto NF) permit search", "lat": 33.550932, "lng": -111.581588, "layer": "dispersed", "note": "Phoenix-east search area. Pin is the Recreation.gov point for the Tonto OHV permit zone, not a campsite. Since Jan 1, 2025 every motorized vehicle inside the zone needs a Tonto OHV permit, including the truck. Camping is banned at staging areas and for the first mile from each gate (first two miles from Blue Point), and 300 feet to either side of the road in that stretch. Past that, 14 days in 30. No running water and no developed campground in the zone. Buy the permit on Recreation.gov before you drive in.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/33.550932,-111.581588,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=33.550932,-111.581588"}, {"label": "Forest rules (PDF)", "href": "https://www.fs.usda.gov/sites/nfs/files/r03/tonto/publication/OHV%20Permit%20Zones%20Rules%20Regulations%2020250516.pdf"}]}, {"name": "Wild Cow Springs (BLM, Hualapai Mtns) search", "lat": 35.0613, "lng": -113.86918, "layer": "dispersed", "note": "Kingman-area BLM campground in the Hualapai Mountains, from the Recreation.gov listing. Fee, water, and whether the road is open in November were not on the page retrieved here. Call the Kingman Field Office before you count on it. It is the named public-land search for the Kingman two-day, not a town RV park.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/35.0613,-113.86918,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=35.0613,-113.86918"}, {"label": "Kingman Field Office", "href": "https://www.blm.gov/office/kingman-field-office"}]}, {"name": "South Fork State Recreation Area", "lat": 40.6572015, "lng": -115.7388639, "layer": "paid", "note": "First-night search south of Elko, on SR-228. Nevada State Parks: camping open all year, 14 days in a 30-day period. East Campground has power sites; the power fee is charged if you take the site, whether or not you plug in. Water spigots: fill, then unhook. Non-Nevada vehicles pay the higher rate. The Nov 1, 2026 state winterization list did not name South Fork. Call 775-744-4346 before you count on water. Senior Pass does not discount Nevada state parks. No dump stop is part of this plan.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/40.6572015,-115.7388639,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=40.6572015,-115.7388639"}, {"label": "Park page", "href": "https://parks.nv.gov/parks/south-fork"}]}, {"name": "Wild Horse State Recreation Area", "lat": 41.669393, "lng": -115.800286, "layer": "paid", "note": "Developed state park on Wild Horse Reservoir, north of Elko on SR-225. Open year-round. The park page lists no hookups; a May 12, 2026 note said Loop 2 electricity was not yet available. Water faucets are summer only. The Nov 1, 2026 winterization notice closed the flush restrooms and showers; pit toilets stay open. 14 days in 30. Cold. Pin is the coordinate on the State Parks map link. Senior Pass does not apply.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/41.669393,-115.800286,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=41.669393,-115.800286"}, {"label": "Park page", "href": "https://parks.nv.gov/parks/wild-horse"}]}, {"name": "Tabor Creek (BLM, near Wells)", "lat": 41.41032, "lng": -115.10803, "layer": "paid", "note": "BLM fee campground west of Wells, on the US-93 approach. Tables, shade, no drinking water listed. Nevada fee-site list (Jan 2025) includes Tabor Creek. 14-day rule. Not a hookup park. Call Elko District 775-753-0200. Pin is the BLM coordinate.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/41.41032,-115.10803,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=41.41032,-115.10803"}, {"label": "BLM", "href": "https://www.blm.gov/visit/tabor-creek-campground"}]}, {"name": "Cave Lake State Park (Lake View)", "lat": 39.1838213, "lng": -114.7172603, "layer": "paid", "note": "Ely-area developed backup, off US-50/6/93 at Success Summit. Lake View is open year-round; Elk Flat is closed Nov 1 through May 1. No hookups are listed. Flush toilets and showers may close in extreme cold. Call 775-296-1505. Stay limit on the park page is seven days in 30. The park warns of several feet of snow in a normal winter, and plowing can wait a day or two. Senior Pass does not apply. Pin is the State Parks map coordinate.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/39.1838213,-114.7172603,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=39.1838213,-114.7172603"}, {"label": "Park page", "href": "https://parks.nv.gov/parks/cave-lake"}]}, {"name": "Cathedral Gorge State Park", "lat": 37.8240508, "lng": -114.4154551, "layer": "paid", "note": "US-93 developed stop at Pioche. Park page: 22 sites with electric hookups, water, and flush restrooms with showers open year-round. 14 days in 30. Open every day. Not on the Nov 1, 2026 winterization list. Senior Pass does not apply. Pin is the State Parks map coordinate. A strong backup if Ely is too cold and you are rolling south.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/37.8240508,-114.4154551,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=37.8240508,-114.4154551"}, {"label": "Park page", "href": "https://parks.nv.gov/parks/cathedral-gorge"}]}, {"name": "Echo Canyon State Park", "lat": 37.911011, "lng": -114.267281, "layer": "paid", "note": "East of Pioche. Nov 1, 2026 Nevada winterization notice: water shut off at each RV site; bathrooms and showers still available; group-use bathroom closed. Confirm before you count on a spigot. Senior Pass does not apply. Pin is the State Parks map coordinate.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/37.911011,-114.267281,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=37.911011,-114.267281"}, {"label": "Park page", "href": "https://parks.nv.gov/parks/echo-canyon"}]}, {"name": "Kershaw-Ryan State Park", "lat": 37.5888639, "lng": -114.521294, "layer": "paid", "note": "In Rainbow Canyon at Caliente, on US-93. Nov 1, 2026 winterization notice: day-use water off; showers, bathrooms, and frost-free spigots in the campground still open. Senior Pass does not apply. Pin is the State Parks map coordinate.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/37.5888639,-114.521294,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=37.5888639,-114.521294"}, {"label": "Park page", "href": "https://parks.nv.gov/parks/kershaw-ryan"}]}, {"name": "Quail Creek State Park", "lat": 37.1854, "lng": -113.3976, "layer": "paid", "note": "St. George area. Utah State Parks: open year-round, drinking water in the campground, partial-hookup sites and standard sites. Published November and December hours are 7 a.m. to 5 p.m. Confirm that an overnight camper can pass the gate after 5. Mild winter climate is the park's own description. Senior Pass does not discount Utah state parks. Reserve at 1-800-322-3770. Pin is the Recreation.gov park coordinate.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/37.1854,-113.3976,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=37.1854,-113.3976"}, {"label": "Park page", "href": "https://stateparks.utah.gov/parks/quail-creek/"}]}, {"name": "Sand Hollow State Park", "lat": 37.1218007, "lng": -113.3852791, "layer": "paid", "note": "St. George / Hurricane developed state park. Pin is the Recreation.gov coordinate. This pass did not re-read a hookup table for Sand Hollow. Confirm winter water and electric on the state parks page before you count on a pedestal. Senior Pass does not apply. Quail Creek, nearby, does publish water and electric.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/37.1218007,-113.3852791,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=37.1218007,-113.3852791"}, {"label": "Park page", "href": "https://stateparks.utah.gov/parks/sand-hollow/"}]}, {"name": "Snow Canyon State Park", "lat": 37.203056, "lng": -113.641389, "layer": "paid", "note": "Developed campground in the red rocks north of St. George. The park page lists drinking water and electricity, year-round camping, and no camping outside the campground. Reservations are recommended. Senior Pass does not apply. Pin is the Recreation.gov coordinate. A two-day outing base as well as a night.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/37.203056,-113.641389,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=37.203056,-113.641389"}, {"label": "Park page", "href": "https://stateparks.utah.gov/parks/snow-canyon/"}]}, {"name": "Coral Pink Sand Dunes State Park", "lat": 37.037682, "lng": -112.7325284, "layer": "paid", "note": "Kanab-area state park. The park page lists drinking water, electricity, showers, and a dump (do not plan a dump; the X195 has no black tank). Hours posted as daylight hours. Hoses freeze when the night drops below freezing even if a spigot is on. Senior Pass does not apply. Pin is the Recreation.gov coordinate.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/37.037682,-112.7325284,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=37.037682,-112.7325284"}, {"label": "Park page", "href": "https://stateparks.utah.gov/parks/coral-pink/"}]}, {"name": "Lone Rock Beach (Glen Canyon NRA)", "lat": 37.01516, "lng": -111.53777, "layer": "paid", "note": "Page / Lake Powell primitive beach, not a hookup park. NPS: $14 per night per vehicle plus the park entrance fee, first-come, no reservations. No potable water. Vault toilets year-round; flush toilets and showers are the summer setup. Sandy roads after the pavement. Senior or Access Pass takes 50% off the camping fee (Glen Canyon fees page, updated Nov 4, 2026); it does not waive the fee. Park camping limit is 14 consecutive days and 30 days a calendar year. Pin is an NPS-published Lone Rock coordinate.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/37.01516,-111.53777,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=37.01516,-111.53777"}, {"label": "NPS", "href": "https://www.nps.gov/glca/planyourvisit/lone-rock-beach.htm"}]}, {"name": "Little Sahara Recreation Area (BLM)", "lat": 39.726489, "lng": -112.307417, "layer": "paid", "note": "Fillmore Field Office sand recreation area, the named BLM site for the Delta / Fillmore part of Route C. Four campgrounds were listed open, and dispersed camping is allowed outside them. As retrieved Nov 10, 2026: water fill stations, dump stations, and flush toilets were CLOSED; the visitor center is closed Nov 8 through spring 2027. Camping is included in the entry fee, first-come. This is an OHV sand area. Stay on the paved campground roads with the trailer. Pin is the Recreation.gov area coordinate.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/39.726489,-112.307417,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=39.726489,-112.307417"}, {"label": "BLM", "href": "https://www.blm.gov/visit/little-sahara-recreation-area"}]}, {"name": "Lake Pleasant Regional Park", "lat": 33.86337, "lng": -112.32155, "layer": "paid", "note": "Maricopa County park northwest of Phoenix, the straightforward developed base for the family week. Developed sites have water and electricity; semi-developed sites do not all have hookups. Shoreline camping is not available. Maximum 14 nights in any 28 days. Reservations. Senior Pass does not discount a county park. Pin is the Recreation.gov Lake Pleasant coordinate (Morristown).", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/33.86337,-112.32155,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=33.86337,-112.32155"}, {"label": "County camping", "href": "https://www.maricopacountyparks.net/park-locator/lake-pleasant-regional-park/camping/"}]}, {"name": "Boulder Beach Campground (Lake Mead NRA)", "lat": 36.037088, "lng": -114.801748, "layer": "paid", "note": "NPS campground on Lake Mead, minutes from Boulder City, open year-round. Large sites, water spigots, restrooms. Electric hookups were not listed in the Recreation.gov description retrieved here. Entrance fee is separate from camping. Senior Pass: confirm the camping discount on the reservation screen. Max stay on the listing is 30 nights. Pin is the campground coordinate.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/36.037088,-114.801748,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=36.037088,-114.801748"}, {"label": "Recreation.gov", "href": "https://www.recreation.gov/camping/campgrounds/10075120"}]}, {"name": "Green River State Park", "lat": 38.9900343, "lng": -110.1569074, "layer": "paid", "note": "Developed Utah state park in Green River, on Route D. Pin is the Recreation.gov coordinate. Confirm winter water and hookups on the state parks page. Senior Pass does not apply. This is the in-town backup if you are not staying out at Goblin Valley or on the San Rafael.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/38.9900343,-110.1569074,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=38.9900343,-110.1569074"}, {"label": "Park page", "href": "https://stateparks.utah.gov/parks/green-river/"}]}, {"name": "Kaibab Lake Campground (Kaibab NF)", "lat": 35.2811111, "lng": -112.1569444, "layer": "paid", "note": "Fee forest campground at Williams, about 30 miles west of Flagstaff on the Kaibab. Recreation.gov: trailers up to 40 feet, elevation 6,800 ft, potable water for drinking only (do not fill the RV tank from the hydrant). A November open date was not in the text retrieved. Snow is likely. No electric hookups were listed. Call the Williams ranger district. Pin is the campground coordinate.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/35.2811111,-112.1569444,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=35.2811111,-112.1569444"}, {"label": "Recreation.gov", "href": "https://www.recreation.gov/camping/campgrounds/233957"}]}, {"name": "Ashurst Lake (Coconino NF)", "lat": 35.01953, "lng": -111.40847, "layer": "paid", "note": "Fee forest campground south of Flagstaff, toward Mormon Lake. Recreation.gov: no utility hookups, drinking water, trailers up to 35 feet (the X195 is under that; the limit is the trailer, not a promise about snow). Winter status was not in the text retrieved. Snow is the risk. Pin is the campground coordinate.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/35.01953,-111.40847,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=35.01953,-111.40847"}, {"label": "Recreation.gov", "href": "https://www.recreation.gov/camping/campgrounds/10210112"}]}, {"name": "Two-day: Elko, Nevada", "lat": 40.83243, "lng": -115.76314, "layer": "twoday", "note": "Western corridor and the first long day. USGS populated place. California Trail Interpretive Center (BLM): free, Wednesday–Sunday 8:30 a.m.–5 p.m., closed Thanksgiving, Christmas, and New Year's, at I-80 exit 292. Lamoille Canyon is the scenic piece and is a winter road closure. Nearby camping search: South Fork SRA, Wild Horse SRA, Lamoille Canyon pin. On Route C and the US-93 reference. Elko nights in November and December are often in the teens or single digits.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/40.83243,-115.76314,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=40.83243,-115.76314"}, {"label": "California Trail", "href": "https://www.blm.gov/learn/interpretive-centers/california-trail-interpretive-center"}]}, {"name": "Two-day: Ely, Nevada", "lat": 39.24744, "lng": -114.88864, "layer": "twoday", "note": "Key multi-day sit on the western corridor (Route C and the US-93 reference). USGS town point, about 6,400 ft. Nevada Northern Railway: check nnry.com for the winter schedule before you count on a weekday train. Ward Charcoal Ovens State Historic Park is open every day. Great Basin National Park and Lehman Caves are a truck day, not a trailer camp (Wheeler Peak Campground allows neither a vehicle nor a towed unit over 24 feet, and it closes for snow). Nearby search: Cave Lake, Ward Mountain, Sacramento Pass.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/39.24744,-114.88864,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=39.24744,-114.88864"}, {"label": "Nevada Northern", "href": "https://nnry.com/"}, {"label": "Lehman Caves", "href": "https://www.nps.gov/grba/planyourvisit/lehman-caves-tours.htm"}]}, {"name": "Two-day: Delta, Utah", "lat": 39.35218, "lng": -112.57718, "layer": "twoday", "note": "Route C town, where US-50/US-6 meets the desert west of I-15. USGS populated place. Topaz Museum covers the WWII incarceration site; confirm winter hours at topazmuseum.org. The local Great Basin Museum is the other small-museum stop; confirm its current hours in town (no web address is linked here). Nearby camping search: Little Sahara Recreation Area.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/39.35218,-112.57718,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=39.35218,-112.57718"}, {"label": "Topaz Museum", "href": "https://topazmuseum.org/"}]}, {"name": "Two-day: Fillmore, Utah", "lat": 38.96886, "lng": -112.32356, "layer": "twoday", "note": "Route C on I-15. USGS populated place. Territorial Statehouse State Park is the historic stop. The state parks site blocked an automated read; use the official page for hours. Nearby camping search: Little Sahara, north of town.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/38.96886,-112.32356,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=38.96886,-112.32356"}, {"label": "Statehouse", "href": "https://stateparks.utah.gov/parks/territorial-statehouse/"}]}, {"name": "Two-day: Cedar City, Utah", "lat": 37.67748, "lng": -113.0619, "layer": "twoday", "note": "I-15 town on Routes A and B, and on Route C once it joins I-15. USGS populated place. Cedar Breaks National Monument is the scenic piece and is a winter closure: the visitor center is closed about mid-October to late May, and the road to the south overlooks is usually closed about mid-November to mid-May. Nearby pinned camping is down at St. George (Quail Creek, Sand Hollow, Snow Canyon), not in the high Dixie forest. Pine Valley Recreation Area is closed until further notice.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/37.67748,-113.0619,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=37.67748,-113.0619"}, {"label": "Cedar Breaks conditions", "href": "https://www.nps.gov/cebr/planyourvisit/conditions.htm"}]}, {"name": "Two-day: St. George, Utah", "lat": 37.10415, "lng": -113.58413, "layer": "twoday", "note": "Key multi-day sit. Mild winter. On Routes A, B, and C. USGS populated place. Zion is a truck day from the south entrance; do not tow through the Zion–Mt. Carmel Tunnel (combined limit 50 feet overall, trailer 26 feet hitch to rear axle, 7 feet 10 inches wide, 11 feet 4 inches tall). Snow Canyon, Quail Creek, and Sand Hollow are the camping searches. Red Cliffs NCA: no dispersed camping. Red Cliffs Campground needs a reservation and rejects vehicles over 11 feet 9 inches tall or wide.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/37.10415,-113.58413,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=37.10415,-113.58413"}, {"label": "Zion tunnel", "href": "https://www.nps.gov/zion/planyourvisit/the-zion-mount-carmel-tunnel.htm"}, {"label": "Red Cliffs NCA", "href": "https://www.blm.gov/visit/red-cliffs-national-conservation-area"}]}, {"name": "Two-day: Kanab, Utah", "lat": 37.04749, "lng": -112.52633, "layer": "twoday", "note": "Routes B and D. USGS populated place. Coral Pink Sand Dunes, Best Friends Animal Sanctuary, and Vermilion Cliffs / White House are the three stops. US-89 toward Page is high enough to snow. Best Friends is a scheduled visit, not a camp. The Wave is a permit hike, not a backup night. Nearby camping search: Coral Pink and White House.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/37.04749,-112.52633,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=37.04749,-112.52633"}, {"label": "Best Friends", "href": "https://bestfriends.org/sanctuary"}, {"label": "Coral Pink", "href": "https://stateparks.utah.gov/parks/coral-pink/"}]}, {"name": "Two-day: Page, Arizona", "lat": 36.91473, "lng": -111.45584, "layer": "twoday", "note": "Routes B and D. USGS populated place. Horseshoe Bend (truck; leave the trailer), Glen Canyon Dam, and Antelope Canyon (Navajo Nation guided tours; confirm winter trips). Nearby camping search: Lone Rock Beach, primitive, no potable water in the off season. Page is cooler than Phoenix and can be windy.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/36.91473,-111.45584,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=36.91473,-111.45584"}, {"label": "Horseshoe Bend", "href": "https://www.nps.gov/glca/planyourvisit/horseshoe-bend.htm"}, {"label": "Glen Canyon Dam", "href": "https://www.nps.gov/glca/planyourvisit/visitorcenters.htm"}, {"label": "Navajo Nation Parks", "href": "https://navajonationparks.org/"}]}, {"name": "Two-day: Flagstaff, Arizona", "lat": 35.19807, "lng": -111.65128, "layer": "twoday", "note": "Routes B and D, before I-17. USGS populated place, high city, snow is normal in November and December. Lowell Observatory, Walnut Canyon, and Sunset Crater / Wupatki are the outings. Bonito Campground at Sunset Crater posted a close for roadwork starting Sept 21, 2026. Nearby camping search: Ashurst Lake (south) and Kaibab Lake at Williams (west). Neither listing confirmed a November open date.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/35.19807,-111.65128,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=35.19807,-111.65128"}, {"label": "Lowell Observatory", "href": "https://lowell.edu/"}, {"label": "Walnut Canyon", "href": "https://www.nps.gov/waca/"}, {"label": "Sunset Crater", "href": "https://www.nps.gov/sucr/"}]}, {"name": "Two-day: Camp Verde / Verde Valley", "lat": 34.56364, "lng": -111.85433, "layer": "twoday", "note": "Off I-17 on Routes B and D. USGS Camp Verde point. Montezuma Castle, Tuzigoot, and Jerome are the loop. Potato Patch Campground on 89A caps combined vehicle length at 40 feet, so the hitched F-350 and X195 will not fit, and it sits at 7,200 ft. Nearest pinned Phoenix-side searches are Lake Pleasant and Bulldog Canyon, which are a drive south, not a Verde campground.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/34.56364,-111.85433,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=34.56364,-111.85433"}, {"label": "Montezuma Castle", "href": "https://www.nps.gov/moca/"}, {"label": "Tuzigoot", "href": "https://www.nps.gov/tuzi/"}]}, {"name": "Two-day: Kingman, Arizona", "lat": 35.18945, "lng": -114.05302, "layer": "twoday", "note": "Routes A, C, and the US-93 reference. USGS populated place. Historic Route 66 Museum at the Powerhouse, and Hualapai Mountain Park as the county in-town alternative to confirm by phone. Nearby public-land search: Wild Cow Springs (BLM). Confirm November access before you climb the mountain.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/35.18945,-114.05302,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=35.18945,-114.05302"}, {"label": "Explore Kingman", "href": "https://www.explorekingman.com/"}]}, {"name": "Two-day: Boulder City, Nevada", "lat": 35.9786, "lng": -114.8325, "layer": "twoday", "note": "Routes A, C, and the US-93 reference, on the way between Las Vegas and Hoover Dam. USGS populated place. Hoover Dam and Lake Mead are the outings. Leave the trailer at Boulder Beach or in town; do not take it across the dam. Nearby camping search: Boulder Beach.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/35.9786,-114.8325,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=35.9786,-114.8325"}, {"label": "Hoover Dam", "href": "https://www.nps.gov/lake/index.htm"}]}, {"name": "Two-day: Valley of Fire State Park", "lat": 36.4303452, "lng": -114.5143309, "layer": "twoday", "note": "Short side off I-15, on Routes A, C, and the reference. Pin is the State Parks map coordinate. Two campgrounds, 72 sites, shaded tables, grills, water, restrooms, showers, reservations, 14 days in 30. The park closes every year December 1 through December 14, including foot entry. Do not plan those dates. Senior Pass does not apply. This is a sit, not only a photo stop.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/36.4303452,-114.5143309,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=36.4303452,-114.5143309"}, {"label": "Park page", "href": "https://parks.nv.gov/parks/valley-of-fire"}]}, {"name": "Two-day: Wickenburg, Arizona", "lat": 33.96865, "lng": -112.72963, "layer": "twoday", "note": "Routes A, C, and the reference, on US-93 north of Phoenix. USGS populated place. Desert Caballeros Western Museum is the stop. Confirm winter hours. Nearby camping search is back toward Lake Pleasant or the Phoenix BLM, not a pinned Wickenburg campground.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/33.96865,-112.72963,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=33.96865,-112.72963"}, {"label": "Desert Caballeros", "href": "https://westernmuseum.org/"}]}, {"name": "Two-day: Price, Utah", "lat": 39.59942, "lng": -110.81073, "layer": "twoday", "note": "Route D, on US-6 east of the Wasatch. USGS populated place. USU Eastern Prehistoric Museum, and Nine Mile Canyon (BLM backcountry byway, no fee at the published point). Scout Nine Mile in the truck; do not take the trailer down a long dirt canyon road you have not seen. Nearby camping search: Green River State Park to the south, or Little Sahara if you are still west.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/39.59942,-110.81073,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=39.59942,-110.81073"}, {"label": "Prehistoric Museum", "href": "https://eastern.usu.edu/prehistoric-museum/"}, {"label": "Nine Mile Canyon", "href": "https://www.blm.gov/visit/nine-mile-canyon"}]}, {"name": "Two-day: Green River, Utah", "lat": 38.99526, "lng": -110.16181, "layer": "twoday", "note": "Route D, where US-6 meets I-70. USGS populated place. Goblin Valley and the San Rafael Swell are the days out. No single Swell campsite is pinned: the USGS range center is not a legal site. Use onX on BLM land and the Price Field Office rules. Nearby developed backup: Green River State Park. Goblin Valley is its own two-day pin.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/38.99526,-110.16181,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=38.99526,-110.16181"}, {"label": "Goblin Valley", "href": "https://stateparks.utah.gov/parks/goblin-valley/"}]}, {"name": "Two-day: Goblin Valley State Park", "lat": 38.5689742, "lng": -110.706287, "layer": "twoday", "note": "Side trip off Route D from Green River / I-70, not the through-highway. Pin is the Recreation.gov park coordinate. Confirm winter water and whether the campground has hookups; the automated read of the state parks page was blocked. Senior Pass does not apply. The valley itself is the hike. Pair with the San Rafael on a truck day.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/38.5689742,-110.706287,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=38.5689742,-110.706287"}, {"label": "Park page", "href": "https://stateparks.utah.gov/parks/goblin-valley/"}]}, {"name": "Two-day: Capitol Reef / Fruita", "lat": 38.2824861, "lng": -111.2468889, "layer": "twoday", "note": "Side trip off Route D on UT-24, not the modeled through-route (that stays on I-70 to Salina, then US-89). Pin is Fruita Campground. Recreation.gov: reservable year-round, picnic tables and fire rings, a dump and potable water are mentioned, 14-day stay limit per year. No cell service at the campground. Scenic drive and petroglyphs along UT-24. Confirm trailer length against the site you reserve. Senior Pass applies to the park entrance; confirm the camping discount.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/38.2824861,-111.2468889,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=38.2824861,-111.2468889"}, {"label": "Park", "href": "https://www.nps.gov/care/"}, {"label": "Fruita", "href": "https://www.recreation.gov/camping/campgrounds/272245"}]}, {"name": "Two-day: Richfield, Utah", "lat": 38.77247, "lng": -112.08411, "layer": "twoday", "note": "On I-70 about 20 miles west of Salina. The modeled Route D turns south on US-89 at Salina and does not pass Richfield. USGS populated place. Fremont Indian State Park is the museum stop, southwest toward I-70 and Clear Creek Canyon. Fish Lake is a high Dixie/Fishlake forest day and a poor November trailer target. Nearby if you jog west: Fremont Indian, then return to US-89.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/38.77247,-112.08411,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=38.77247,-112.08411"}, {"label": "Fremont Indian", "href": "https://stateparks.utah.gov/parks/fremont-indian/"}]}, {"name": "Two-day: City of Rocks", "lat": 42.067203, "lng": -113.701382, "layer": "twoday", "note": "I-84 side between Burley and the Snowville climb, so it sits on Routes A, B, and D. Route C leaves I-84 at Twin Falls for Jackpot and misses it. Pin is the National Reserve campground. The reserve is open year-round; roads can close in snow. Camping page: some sites have seasonal water and electricity; confirm which loops are open in November. 14 days in a 30-day period. Silent City and the California Trail ruts are the walk. Senior Pass: confirm on the reservation.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/42.067203,-113.701382,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=42.067203,-113.701382"}, {"label": "Camping", "href": "https://www.nps.gov/ciro/planyourvisit/camping.htm"}, {"label": "Hours", "href": "https://www.nps.gov/ciro/planyourvisit/hours.htm"}]}, {"name": "Great Basin NP / Lehman Caves", "lat": 39.005691, "lng": -114.219904, "layer": "outing", "note": "Outing from Ely, not the sit. Pin is the Lehman Caves Visitor Center. Book cave tours on the NPS page; winter tour schedules change. Wheeler Peak Campground: no vehicle and no towed unit over 24 feet, and it closes for snow, sometimes as early as September. Baker Creek has no potable water. Do not take the X195 up the Wheeler Peak road.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/39.005691,-114.219904,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=39.005691,-114.219904"}, {"label": "Lehman Caves", "href": "https://www.nps.gov/grba/planyourvisit/lehman-caves-tours.htm"}, {"label": "Park", "href": "https://www.nps.gov/grba/"}]}, {"name": "Zion National Park", "lat": 37.298393, "lng": -113.026514, "layer": "outing", "note": "Outing from St. George, not a trailer camp. Pin is the Recreation.gov park coordinate. Drive the truck to the south entrance and use the shuttle when it is running. The Mt. Carmel tunnel is not on any tow route drawn here. Watchman non-electric sites do not take a vehicle or combination 19 feet and over, so do not plan the X195 inside Zion.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/37.298393,-113.026514,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=37.298393,-113.026514"}, {"label": "Tunnel limits", "href": "https://www.nps.gov/zion/planyourvisit/the-zion-mount-carmel-tunnel.htm"}]}, {"name": "Grand Canyon South Rim", "lat": 36.0497222, "lng": -112.1204694, "layer": "outing", "note": "Outing from Flagstaff, not a sit. Pin is Mather Campground, on the South Rim, so the dot is the rim and not the inner canyon. Mather's own text recommends reservations March 1–November 30. December operations, snow, and site length need a check before anyone moves a trailer there. The day trip is the truck.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/36.0497222,-112.1204694,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=36.0497222,-112.1204694"}, {"label": "Park", "href": "https://www.nps.gov/grca/"}]}, {"name": "Cedar Breaks National Monument", "lat": 37.63332, "lng": -112.84245, "layer": "outing", "note": "Outing from Cedar City, often closed to cars in this season. Pin is the USGS summit name point, not a parking lot. NPS: visitor center closed about mid-October to late May. The road through the south end (SR-148) is usually closed to vehicles about mid-November to mid-May. SR-143 on the north end stays open more often and can still close in a storm. Over 10,000 feet.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/37.63332,-112.84245,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=37.63332,-112.84245"}, {"label": "Conditions", "href": "https://www.nps.gov/cebr/planyourvisit/conditions.htm"}]}, {"name": "Ward Charcoal Ovens State Historic Park", "lat": 39.0368996, "lng": -114.8472976, "layer": "outing", "note": "Ely outing, and a real campground if you want it. Always open. 14 days in 30. The park page describes camping, picnicking, and the ovens. Do not climb on the ovens. Senior Pass does not apply. Pin is the State Parks map coordinate. Winter trails are ski and snowshoe, not a guaranteed plowed spur.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/39.0368996,-114.8472976,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=39.0368996,-114.8472976"}, {"label": "Park page", "href": "https://parks.nv.gov/parks/ward-charcoal-ovens"}]}, {"name": "Montezuma Castle National Monument", "lat": 34.622378, "lng": -111.814786, "layer": "outing", "note": "Verde Valley outing off I-17. Pin is the Recreation.gov monument coordinate. Cliff dwelling, short walk. Confirm winter hours on the NPS page. Not a camp.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/34.622378,-111.814786,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=34.622378,-111.814786"}, {"label": "NPS", "href": "https://www.nps.gov/moca/"}]}, {"name": "Tuzigoot National Monument", "lat": 34.772964, "lng": -112.027907, "layer": "outing", "note": "Verde Valley outing at Clarkdale, paired with Jerome and Montezuma Castle. Pin is the Recreation.gov coordinate. Confirm winter hours. Not a camp.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/34.772964,-112.027907,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=34.772964,-112.027907"}, {"label": "NPS", "href": "https://www.nps.gov/tuzi/"}]}, {"name": "Walnut Canyon National Monument", "lat": 35.16823, "lng": -111.502424, "layer": "outing", "note": "Flagstaff outing, east of town. Pin is the Recreation.gov coordinate. Island trail is a stair climb; there is also a rim walk. Confirm winter hours and any ice closure. Not a camp.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/35.16823,-111.502424,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=35.16823,-111.502424"}, {"label": "NPS", "href": "https://www.nps.gov/waca/"}]}, {"name": "Wupatki National Monument", "lat": 35.557411, "lng": -111.395722, "layer": "outing", "note": "Flagstaff outing on the loop with Sunset Crater. Pin is the Recreation.gov coordinate. Pueblo and the ball court. Confirm winter hours. Not a camp.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/35.557411,-111.395722,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=35.557411,-111.395722"}, {"label": "NPS", "href": "https://www.nps.gov/wupa/"}]}, {"name": "Sunset Crater Volcano", "lat": 35.370429, "lng": -111.543602, "layer": "outing", "note": "Flagstaff outing. Pin is Bonito Campground, which posted an early close for roadwork starting Sept 21, 2026. Do not plan to camp here. The monument road is a separate question; check nps.gov/sucr the week you go. Lava flow trail is the walk when it is open.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/35.370429,-111.543602,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=35.370429,-111.543602"}, {"label": "NPS", "href": "https://www.nps.gov/sucr/"}]}, {"name": "Horseshoe Bend", "lat": 36.88013, "lng": -111.51735, "layer": "view", "note": "Viewpoint, not a camp. Pin is the USGS name point for the bend. The NPS overlook and parking lot are the visit, a short walk from US-89 south of Page. Leave the trailer in town or at Lone Rock. No water on the trail. The NPS page is the safety briefing.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/36.88013,-111.51735,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=36.88013,-111.51735"}, {"label": "NPS", "href": "https://www.nps.gov/glca/planyourvisit/horseshoe-bend.htm"}]}, {"name": "Glen Canyon Dam", "lat": 36.93811, "lng": -111.49406, "layer": "view", "note": "Viewpoint at Page. Pin is the Recreation.gov Glen Canyon Dam coordinate. Tour availability in November and December changes; check the NPS dam page. Not a camp.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/36.93811,-111.49406,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=36.93811,-111.49406"}, {"label": "NPS", "href": "https://www.nps.gov/glca/planyourvisit/visitorcenters.htm"}]}, {"name": "Hoover Dam", "lat": 36.0160918, "lng": -114.7380381, "layer": "view", "note": "Viewpoint from Boulder City. Pin is the Recreation.gov Hoover Dam coordinate. Security and vehicle rules apply. Do not take the trailer across the dam. Not a camp.", "links": [{"label": "onX Offroad", "href": "https://webmap.onxmaps.com/offroad/map/query/36.0160918,-114.7380381,13/overview"}, {"label": "Google Maps", "href": "https://www.google.com/maps?q=36.0160918,-114.7380381"}, {"label": "NPS Lake Mead", "href": "https://www.nps.gov/lake/index.htm"}]}, {"name": "Nine Mile Canyon (BLM byway)", "lat": 39.55555, "lng": -110.6678, "layer": "view", "note": "Rock-art drive from the Price / Wellington side of Route D. Pin is the BLM byway coordinate. No fee at that listing. The published direction is from Wellington along So       cb.checked = true;
      cb.addEventListener("change", () => { layerOn[key] = cb.checked; applyVisibility(); });
      const span = document.createElement("span");
      span.innerHTML = '<span class="swatch ' + sw + '"></span>' + label;
      row.appendChild(cb);
      row.appendChild(span);
      body.appendChild(row);
    });
    const head = document.createElement("div");
    head.style.margin = "8px 0 4px";
    head.innerHTML = "<b>Routes</b> <span class='fine'>Car router, not the trailer. Hitching is 2–3 hours. Weekday work ends at 3 p.m. MT.</span>";
    body.appendChild(head);
    ROUTES.forEach((r) => {
      const row = document.createElement("label");
      row.className = "route-row";
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = true;
      cb.addEventListener("change", () => { routeOn[r.id] = cb.checked; applyVisibility(); });
      const span = document.createElement("span");
      span.className = "route-copy";
      span.innerHTML =
        '<b><span class="swatch route" style="background:' + r.color + '"></span>' + r.title + '</b>' +
        '<span class="fine" id="mi-' + r.id + '">OSRM trace ' + r.osrmMi.toLocaleString() + ' mi · ' + r.osrmH + ' h car. ' + r.known + '</span><br>' +
        '<span class="fine">' + r.blurb + '</span>';
      row.appendChild(cb);
      row.appendChild(span);
      body.appendChild(row);
    });
    const foot = document.createElement("div");
    foot.style.marginTop = "8px";
    foot.innerHTML = '<a href="locations.html">Locations</a> · <a href="tonight.html">Tonight</a> · <a href="tomorrow.html">Tomorrow</a> · <a href="../index.html">October trip</a>';
    body.appendChild(foot);
  }
  function drawCorridor(route) {
    const icons = route.dash ? [{
      icon: { path: "M 0,-1 0,1", strokeOpacity: 1, scale: 3 },
      offset: "0",
      repeat: "14px"
    }] : null;
    const line = new google.maps.Polyline({
      map: routeOn[route.id] ? map : null,
      path: route.path,
      geodesic: false,
      strokeColor: route.color,
      strokeOpacity: route.dash ? 0 : 0.9,
      strokeWeight: route.dash ? 0 : 5,
      icons: icons || undefined,
      zIndex: route.dash ? 2 : 3,
      clickable: false
    });
    corridorLines[route.id] = line;
  }
  function fitTrip() {
    const bounds = new google.maps.LatLngBounds();
    let any = false;
    PLACES.forEach((p) => {
      if (!layerOn[p.layer]) return;
      bounds.extend({ lat: p.lat, lng: p.lng });
      any = true;
    });
    ROUTES.forEach((r) => {
      if (!routeOn[r.id]) return;
      (r.path || []).forEach((p) => bounds.extend(p));
      any = true;
    });
    if (any) map.fitBounds(bounds, 48);
  }
  function originMode() { return $("origin-select").value; }
  function knownOrigin() {
    const mode = originMode();
    if (mode === "geolocation" && geolocPos) return geolocPos;
    if (mode === "custom" && searchPlace) return { lat: searchPlace.lat, lng: searchPlace.lng };
    return BOISE;
  }
  function originLabel() {
    const mode = originMode();
    if (mode === "geolocation") return "My location";
    if (mode === "custom" && searchPlace) return searchPlace.name;
    return "Boise / home";
  }
  function getGeolocation() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) { reject(new Error("Location is not available in this browser.")); return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          geolocPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          setMarkerMap(meMarker, null);
          meMarker = makeMarker(geolocPos, "me", "My location", null);
          resolve(geolocPos);
        },
        (err) => reject(new Error("Couldn't get your location" + (err && err.message ? " (" + err.message + ")" : "") + ".")),
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 120000 }
      );
    });
  }
  async function resolveOrigin() {
    const mode = originMode();
    if (mode === "boise") return { pos: BOISE, name: "Boise / home" };
    if (mode === "geolocation") {
      if (geolocPos) return { pos: geolocPos, name: "My location" };
      setMsg("Getting your location…");
      return { pos: await getGeolocation(), name: "My location" };
    }
    if (mode === "custom") {
      if (searchPlace) return { pos: { lat: searchPlace.lat, lng: searchPlace.lng }, name: searchPlace.name };
      throw new Error("Search for a place first, then tap a pin → Directions here.");
    }
    return { pos: BOISE, name: "Boise / home" };
  }
  function showPanel(originName, origin, dest) {
    $("dir-title").textContent = "To " + dest.name;
    $("dir-route").textContent = "From " + (originName || "your location") + " · driving";
    $("dir-summary").textContent = "";
    $("dir-error").textContent = "";
    $("dir-note").textContent = "";
    $("dir-gmaps").href = gmapsUrl(origin, dest);
    $("directions-panel").classList.add("show");
  }
  function hidePanel() { $("directions-panel").classList.remove("show"); }
  function clearPinRoute() {
    pinRouteLines.forEach((l) => l.setMap(null));
    pinRouteLines = [];
    hidePanel();
    lastDest = null;
    setMsg(OPEN_NOTE);
  }
  function directionsRoute(req) {
    return new Promise((resolve, reject) => {
      if (!directionsService) { reject(new Error("Directions service is not available.")); return; }
      directionsService.route(req, (result, status) => {
        if (status === "OK" && result) resolve(result);
        else reject(new Error("Directions: " + status));
      });
    });
  }
  async function routeTo(lat, lng, name) {
    const dest = { lat: Number(lat), lng: Number(lng), name: name || "Destination" };
    lastDest = dest;
    pinRouteLines.forEach((l) => l.setMap(null));
    pinRouteLines = [];
    showPanel(originLabel(), knownOrigin(), dest);
    let origin, originName;
    try {
      const o = await resolveOrigin();
      origin = o.pos; originName = o.name;
    } catch (e) {
      $("dir-error").textContent = errText(e);
      setMsg(errText(e), true);
      return;
    }
    if (lastDest !== dest) return;
    showPanel(originName, origin, dest);
    $("dir-summary").textContent = "Routing…";
    try {
      const result = await directionsRoute({
        origin: origin,
        destination: dest,
        travelMode: google.maps.TravelMode.DRIVING
      });
      if (lastDest !== dest) return;
      const r = result.routes[0];
      const line = new google.maps.Polyline({
        map: map,
        path: r.overview_path,
        strokeColor: "#c53030",
        strokeOpacity: 0.95,
        strokeWeight: 6,
        zIndex: 40
      });
      pinRouteLines = [line];
      let meters = 0, sec = 0;
      r.legs.forEach((leg) => { meters += leg.distance.value; sec += leg.duration.value; });
      $("dir-summary").textContent = fmtMiles(meters) + " · " + fmtDuration(sec);
      $("dir-note").textContent = "Car time from Google. Towing is slower, and hitching is 2–3 hours before you roll. The colored lines are the whole-trip corridors.";
      setMsg("Route ready: " + originName + " → " + dest.name);
      const panelH = window.innerWidth < 760 ? $("directions-panel").offsetHeight : 0;
      map.fitBounds(r.bounds, { top: 40, left: 30, right: window.innerWidth < 760 ? 30 : 390, bottom: 30 + panelH });
    } catch (e) {
      $("dir-summary").textContent = "";
      $("dir-error").textContent = errText(e) + " Open in Google Maps still works.";
      setMsg("Pin directions failed. Corridor lines are unchanged.", true);
    }
  }
  async function upgradeCorridors() {
    if (!directionsService) return;
    for (const route of ROUTES) {
      const wps = route.waypoints;
      if (!wps || wps.length < 2) continue;
      try {
        const result = await directionsRoute({
          origin: wps[0],
          destination: wps[wps.length - 1],
          waypoints: wps.slice(1, -1).map((p) => ({ location: p, stopover: true })),
          travelMode: google.maps.TravelMode.DRIVING,
          optimizeWaypoints: false
        });
        const r = result.routes[0];
        const line = corridorLines[route.id];
        if (line) {
          line.setPath(r.overview_path);
          if (route.dash) {
            line.setOptions({ strokeOpacity: 0, strokeWeight: 0 });
          }
        }
        route.path = r.overview_path.map(ll);
        let meters = 0, sec = 0;
        r.legs.forEach((leg) => { meters += leg.distance.value; sec += leg.duration.value; });
        const el = document.getElementById("mi-" + route.id);
        if (el) {
          el.textContent = "Google car " + fmtMiles(meters) + " · " + fmtDuration(sec) + ". " + route.known;
        }
      } catch (e) {
        console.warn("Corridor " + route.id + " stayed on the OSRM trace.", e);
        const el = document.getElementById("mi-" + route.id);
        if (el) el.textContent += " Directions did not replace this line.";
      }
    }
  }
  function placesError(detail) {
    placesFailed = true;
    setMsg("Place search is unavailable." + (detail ? " " + detail : ""), true);
  }
  async function onPlaceSelected(ev) {
    const pred = ev.placePrediction || (ev.detail && ev.detail.placePrediction);
    if (!pred) { setMsg("No place details returned.", true); return; }
    let place;
    try {
      place = pred.toPlace();
      await place.fetchFields({ fields: ["displayName", "location", "formattedAddress"] });
    } catch (e) {
      placesError(errText(e));
      return;
    }
    const loc = ll(place.location);
    if (!loc || isNaN(loc.lat)) { setMsg("That place has no location.", true); return; }
    searchPlace = {
      name: place.displayName || place.formattedAddress || "Searched place",
      lat: loc.lat, lng: loc.lng, layer: "search",
      note: "Searched place.",
      links: []
    };
    setMarkerMap(searchMarker, null);
    searchMarker = makeMarker(loc, "search", searchPlace.name, (mk) => openInfo(searchPlace, mk));
    map.panTo(loc);
    if (map.getZoom() < 8) map.setZoom(9);
    if (originMode() === "custom") {
      setMsg("Start set to " + searchPlace.name + ". Tap a pin → Directions here.");
      if (lastDest) routeTo(lastDest.lat, lastDest.lng, lastDest.name);
    } else {
      routeTo(searchPlace.lat, searchPlace.lng, searchPlace.name);
    }
  }
  function setupSearch() {
    const wrap = $("search-wrap");
    if (!gm.PlaceAutocompleteElement) {
      wrap.innerHTML = '<input id="search-fallback" disabled placeholder="Place search unavailable" />';
      return;
    }
    const pac = new gm.PlaceAutocompleteElement({ includedRegionCodes: ["us"] });
    pac.setAttribute("placeholder", "Search a place or address…");
    try { pac.placeholder = "Search a place or address…"; } catch (_) {}
    wrap.innerHTML = "";
    wrap.appendChild(pac);
    pac.addEventListener("gmp-select", onPlaceSelected);
    const onErr = (e) => placesError(errText(e && (e.error || e.detail || e)));
    pac.addEventListener("gmp-error", onErr);
    pac.addEventListener("gmp-requesterror", onErr);
  }
  async function init() {
    if (window.innerWidth < 760) $("legend").removeAttribute("open");
    buildLegend();
    $("btn-go").addEventListener("click", () => {
      if (!searchPlace) {
        setMsg(placesFailed ? "Place search is unavailable. Tap a pin." : "Search for a place, or tap a pin.", placesFailed);
        return;
      }
      if (originMode() === "custom") {
        setMsg("The searched place is the start. Tap a pin for the destination.");
        return;
      }
      routeTo(searchPlace.lat, searchPlace.lng, searchPlace.name);
    });
    $("btn-clear").addEventListener("click", clearPinRoute);
    $("btn-fit").addEventListener("click", () => { clearPinRoute(); fitTrip(); });
    $("dir-close").addEventListener("click", hidePanel);
    $("origin-select").addEventListener("change", () => {
      if (originMode() === "geolocation" && !geolocPos) {
        getGeolocation().then(() => setMsg("Using your location as the start.")).catch((e) => setMsg(errText(e), true));
      }
      if (lastDest) routeTo(lastDest.lat, lastDest.lng, lastDest.name);
    });

    let mapsLib;
    try { mapsLib = await google.maps.importLibrary("maps"); }
    catch (e) { setMsg("Google Maps failed to load: " + errText(e), true); return; }
    gm.Map = mapsLib.Map;
    gm.InfoWindow = mapsLib.InfoWindow;
    try {
      const markerLib = await google.maps.importLibrary("marker");
      gm.AdvancedMarkerElement = markerLib.AdvancedMarkerElement;
      useAdvanced = !!gm.AdvancedMarkerElement;
    } catch (e) { useAdvanced = false; }
    try {
      const routesLib = await google.maps.importLibrary("routes");
      const Svc = (routesLib && routesLib.DirectionsService) || google.maps.DirectionsService;
      if (Svc) directionsService = new Svc();
    } catch (e) {
      if (google.maps.DirectionsService) directionsService = new google.maps.DirectionsService();
    }

    map = new gm.Map($("map"), {
      center: BOISE,
      zoom: 7,
      mapId: useAdvanced ? MAP_ID : undefined,
      mapTypeControl: true,
      mapTypeControlOptions: { style: google.maps.MapTypeControlStyle.DROPDOWN_MENU, position: google.maps.ControlPosition.TOP_LEFT },
      zoomControl: true,
      streetViewControl: false,
      fullscreenControl: false,
      cameraControl: false,
      scaleControl: true,
      clickableIcons: false,
      gestureHandling: "greedy"
    });
    infoWindow = new gm.InfoWindow({ maxWidth: 300 });
    PLACES.forEach((place) => {
      const marker = makeMarker({ lat: place.lat, lng: place.lng }, place.layer, place.name, (mk) => openInfo(place, mk));
      markerRecs.push({ layer: place.layer, marker: marker });
    });
    ROUTES.forEach(drawCorridor);
    setMsg(OPEN_NOTE);
    try {
      const placesLib = await google.maps.importLibrary("places");
      gm.PlaceAutocompleteElement = placesLib.PlaceAutocompleteElement;
    } catch (e) { console.warn("places library failed", e); }
    setupSearch();
    upgradeCorridors();
  }
  init();
})();
  </script>
